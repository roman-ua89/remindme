<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .client { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; rx: 12; }
      .server { fill: #dcfce7; stroke: #4ade80; stroke-width: 1.5; rx: 12; }
      .box { fill: white; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 11px; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="30" y="28" font-size="18" font-weight="700" fill="#0f172a">Error handling</text>

  <rect class="client" x="40" y="50" width="320" height="150"/>
  <text class="title" x="60" y="75">Frontend</text>
  <rect class="box" x="60" y="90" width="130" height="36"/><text class="label" x="75" y="112">Zod validation</text>
  <rect class="box" x="210" y="90" width="130" height="36"/><text class="label" x="225" y="112">API 4xx / 5xx</text>
  <rect class="box" x="60" y="145" width="130" height="36"/><text class="label" x="72" y="167">FieldError under input</text>
  <rect class="box" x="210" y="145" width="130" height="36"/><text class="label" x="225" y="167">Sonner toast</text>

  <rect class="server" x="420" y="50" width="320" height="150"/>
  <text class="title" x="440" y="75">Backend</text>
  <rect class="box" x="440" y="90" width="130" height="36"/><text class="label" x="455" y="112">auth.service throws</text>
  <rect class="box" x="590" y="90" width="130" height="36"/><text class="label" x="605" y="112">error-handler</text>
  <rect class="box" x="500" y="145" width="180" height="36"/><text class="label" x="515" y="167">{ message, messageKey, code }</text>

  <path class="edge" d="M125 126 V145"/>
  <path class="edge" d="M275 126 V145"/>
  <path class="edge" d="M340 108 H420"/>
  <path class="edge" d="M570 126 V145"/>

  <rect x="40" y="230" width="700" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="255" font-size="12" font-weight="700" fill="#0f172a">Where errors appear</text>
  <text x="60" y="280" font-size="11" fill="#334155">" Invalid email / empty password ’ red text under the form field</text>
  <text x="60" y="302" font-size="11" fill="#334155">" Wrong password on login ’ Sonner toast: "Invalid email or password"</text>
  <text x="60" y="324" font-size="11" fill="#334155">" 401 on protected route (guard) ’ silent redirect to /auth/login (no toast)</text>
  <text x="60" y="346" font-size="11" fill="#334155">" Network / server error ’ Sonner toast with fallback message</text>
  <text x="60" y="372" font-size="11" fill="#64748b">messageKey (e.g. auth.invalid_credentials) is stored for future i18n</text>
</svg>
